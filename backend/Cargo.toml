[package]
name = "watchbeat"
version = "0.7.2"
edition = "2021"
description = "Self-hosted uptime monitor"
license = "MIT"
repository = "https://github.com/atareao/watchbeat"
homepage = "https://github.com/atareao/watchbeat"
keywords = ["uptime", "monitoring", "status"]
categories = ["web-programming", "monitoring"]

[[bin]]
name = "watchbeat"
path = "src/main.rs"

[lib]
name = "watchbeat"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = [
    "json", "rustls",
] }

# OIDC / Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23"
cookie = "0.18"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1.15"
webpki-roots = "1.0"
x509-parser = "0.18"

# Embed SPA
include_dir = "0.7"

# General
uuid = { version = "1.25", features = ["v4", "serde"] }
anyhow = "1.0"
regex = "1"
minijinja = { version = "2.6", features = ["builtins", "json"] }
prometheus-client = "0.25"

# Email/SMTP
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
url = "2.5"

# PKCE
sha1 = "0.11"
sha2 = "0.11"

dotenvy = "0.15"
async-trait = "0.1"
serde_urlencoded = "0.7"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
